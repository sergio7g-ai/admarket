<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="admarket — publicidade inteligente para supermercados: promoções com margem garantida, posts, carrossel e reels.">
<meta name="theme-color" content="#1E40AF">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>admarket</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
/* Layout: mobile-first SaaS dashboard. Sticky glass header, pill nav (tablet+) / glass tab bar (phone), metric row, hero suggestion + decision panel, floating invoice button. Single light theme by design. */
:root{
  color-scheme:light;
  --bg:#F8FAFC; --solid:#FFFFFF; --glass:rgba(255,255,255,.72); --glass-strong:rgba(255,255,255,.86);
  --line:rgba(15,23,42,.07); --line-2:rgba(15,23,42,.12);
  --fg:#0F172A; --fg-2:#334155; --muted:#64748B; --subtle:#94A3B8; --wash:#F1F5F9;
  --blue:#1E40AF; --blue-2:#3B82F6; --blue-soft:#EFF6FF; --blue-ink:#1E40AF;
  --green:#10B981; --green-deep:#059669; --green-soft:#ECFDF5; --green-ink:#047857;
  --orange:#F97316; --orange-soft:#FFF7ED; --orange-ink:#C2410C;
  --red-soft:#FEF2F2; --red-ink:#B91C1C;
  --sh-1:0 1px 2px rgba(15,23,42,.04);
  --sh-2:0 1px 2px rgba(15,23,42,.04),0 12px 32px -16px rgba(15,23,42,.14);
  --sh-3:0 2px 4px rgba(15,23,42,.04),0 24px 48px -20px rgba(15,23,42,.22);
  --r-xl:16px; --r-2xl:22px;
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-head:"Plus Jakarta Sans","Inter",system-ui,sans-serif;
  --tabbar:72px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100%}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(40rem 28rem at 92% -6%,rgba(59,130,246,.10),transparent 60%),radial-gradient(34rem 26rem at -8% 30%,rgba(16,185,129,.07),transparent 60%),var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--glass-strong)}
h1,h2,h3{font-family:var(--f-head);margin:0;letter-spacing:-.02em;text-wrap:balance;color:var(--fg)}
h1{font-size:1.55rem;font-weight:700}
h2{font-size:1.05rem;font-weight:700}
h3{font-size:.95rem;font-weight:600}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue-2);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.xs{font-size:.76rem}
.label{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--glass-strong);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:12px;height:64px}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto;text-decoration:none}
.logo-mark{height:35px;width:auto;display:block}
.logo-type{height:21px;width:auto;display:block;margin-top:2px}
.logo-word{font-family:var(--f-head);font-weight:800;font-size:1.2rem;letter-spacing:-.03em;color:var(--fg)}
.logo-word span{color:var(--blue)}
.ai{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:999px;background:var(--green-soft);color:var(--green-ink);font-size:.8rem;font-weight:600;border:1px solid rgba(16,185,129,.18)}
.ai i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(16,185,129,.5);animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.45)}70%{box-shadow:0 0 0 7px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
.me{position:relative}
.me-btn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--solid);border-radius:999px;padding:3px 10px 3px 3px;box-shadow:var(--sh-1)}
.me-btn .who{display:flex;flex-direction:column;line-height:1.15;text-align:left}
.me-btn .who b{font-size:.84rem;font-weight:600;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-btn .who span{font-size:.72rem;color:var(--muted)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-head);font-weight:700;font-size:.8rem;overflow:hidden;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.7)}
.avatar img{width:100%;height:100%;object-fit:cover}
.menu{position:absolute;right:0;top:calc(100% + 8px);width:250px;background:var(--glass-strong);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--sh-3);padding:6px;z-index:35}
.menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:10px 12px;border-radius:10px;text-align:left;font-size:.9rem}
.menu button:hover{background:var(--wash)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.menu .tick{margin-left:auto;color:var(--green)}

/* ---------- nav ---------- */
.pills{display:flex;gap:4px;padding-block:12px 0;overflow-x:auto;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pills button{flex:none;display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--muted);font-weight:500;font-size:.9rem;padding:8px 14px;border-radius:999px;transition:background .15s,color .15s}
.pills button:hover{color:var(--fg);background:rgba(15,23,42,.04)}
.pills button[aria-current="page"]{background:var(--solid);color:var(--fg);box-shadow:var(--sh-2);font-weight:600}
.pills .dot{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--orange);color:#fff;font-size:.68rem;font-weight:700;display:inline-grid;place-items:center}
.tabbar{display:none}

/* ---------- page ---------- */
main{padding-block:22px 120px;display:flex;flex-direction:column;gap:22px;min-width:0}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph p{color:var(--muted);margin-top:4px;max-width:60ch}
.card{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r-2xl);box-shadow:var(--sh-2);min-width:0}
.pad{padding:20px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}

/* metrics */
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.metric{padding:16px 18px;display:flex;gap:14px;align-items:center}
.m-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.m-ic svg{width:20px;height:20px}
.m-body{min-width:0;display:flex;flex-direction:column;gap:2px}
.m-val{font-family:var(--f-head);font-size:1.6rem;font-weight:800;letter-spacing:-.03em;line-height:1.1;display:flex;align-items:center;gap:8px}
.m-badge{font-family:var(--f-ui);font-size:.7rem;font-weight:700;background:var(--orange);color:#fff;border-radius:999px;padding:2px 8px;letter-spacing:0}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
.sug{overflow:hidden}
.sug-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 0}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap}
.chip svg{width:13px;height:13px}
.c-blue{background:var(--blue-soft);color:var(--blue-ink)}
.c-green{background:var(--green-soft);color:var(--green-ink)}
.c-orange{background:var(--orange-soft);color:var(--orange-ink)}
.c-grey{background:var(--wash);color:var(--muted)}
.c-red{background:var(--red-soft);color:var(--red-ink)}
.stepper{display:flex;align-items:center;gap:4px}
.icon-btn{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--solid);display:grid;place-items:center;color:var(--fg-2)}
.icon-btn:hover{background:var(--wash)}
.icon-btn:disabled{opacity:.4;cursor:default}
.icon-btn svg{width:16px;height:16px}
.shot{position:relative;margin:14px 16px 0;border-radius:var(--r-xl);aspect-ratio:16/10;max-width:100%;overflow:hidden;display:grid;place-items:center}
.shot svg.art{width:66%;height:auto;max-height:86%;filter:drop-shadow(0 18px 22px rgba(15,23,42,.18))}
.shot .floor{position:absolute;left:18%;right:18%;bottom:9%;height:9%;border-radius:50%;background:radial-gradient(closest-side,rgba(15,23,42,.18),transparent)}
.glass-tag{position:absolute;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.66);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.7);box-shadow:var(--sh-1);font-size:.8rem;font-weight:600}
.glass-tag.tl{left:12px;top:12px}
.glass-tag.br{right:12px;bottom:12px;flex-direction:column;align-items:flex-start;gap:0}
.glass-tag.br b{font-family:var(--f-head);font-size:1.3rem;font-weight:800;color:var(--green-ink);letter-spacing:-.02em;line-height:1.1}
.glass-tag .shield{width:16px;height:16px;color:var(--green-deep)}
.sug-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:18px}
.prices{display:grid;grid-template-columns:auto auto 1fr;align-items:end;gap:14px 22px}
.pv{display:flex;flex-direction:column;gap:2px}
.pv b{font-family:var(--f-head);font-weight:700;font-size:1.25rem;letter-spacing:-.02em}
.pv.cost b{color:var(--muted);font-weight:600}
.pv.new b{font-size:2.1rem;font-weight:800;color:var(--fg);line-height:1}
.arrow{color:var(--subtle);align-self:center;padding-top:14px}
.pv.mg{justify-self:end;text-align:right}
.pv.mg b{color:var(--green-ink)}
.comp{display:flex;flex-direction:column;gap:9px;padding-top:16px;border-top:1px solid var(--line)}
.bar{display:grid;grid-template-columns:96px minmax(0,1fr) 62px;align-items:center;gap:12px;font-size:.84rem}
.bar .track{height:6px;border-radius:99px;background:var(--wash);overflow:hidden}
.bar .fill{height:100%;border-radius:99px;background:#CBD5E1}
.bar.ours .fill{background:linear-gradient(90deg,var(--green),#34D399)}
.bar.ours span,.bar.ours b{color:var(--green-ink);font-weight:700}
.bar b{text-align:right;font-weight:600}
.why{font-size:.84rem;color:var(--muted)}

/* decision */
.decide{padding:20px;display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(84px + env(safe-area-inset-top,0px))}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.thumb{border:0;padding:0;background:none;border-radius:14px;position:relative;text-align:left;display:flex;flex-direction:column;gap:6px}
.thumb .frame{border-radius:12px;padding:3px;box-shadow:0 0 0 1px var(--line);transition:box-shadow .15s,transform .15s}
.thumb:hover .frame{transform:translateY(-1px)}
.thumb[aria-pressed="true"] .frame{box-shadow:0 0 0 2px var(--blue-2),0 10px 24px -12px rgba(59,130,246,.55)}
.thumb .check{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--blue-2);color:#fff;display:none;place-items:center;box-shadow:0 2px 6px rgba(15,23,42,.2)}
.thumb[aria-pressed="true"] .check{display:grid}
.thumb .check svg{width:12px;height:12px}
.thumb .cap{font-size:.74rem;color:var(--muted);font-weight:500;padding-left:2px}
.thumb[aria-pressed="true"] .cap{color:var(--fg);font-weight:600}
.when{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r-xl);background:var(--blue-soft)}
.when svg{width:18px;height:18px;color:var(--blue-2);flex:none}
.when b{display:block;font-size:.88rem}
.when span{font-size:.78rem;color:var(--muted)}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:52px;border:0;border-radius:14px;background:linear-gradient(180deg,#14C98F,var(--green-deep));color:#fff;font-weight:700;font-size:1rem;letter-spacing:-.01em;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 12px 24px -12px rgba(5,150,105,.7);transition:transform .12s,box-shadow .12s}
.cta:hover{transform:translateY(-1px);box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 16px 28px -12px rgba(5,150,105,.75)}
.cta:active{transform:translateY(0)}
.cta svg{width:18px;height:18px}
.textlink{border:0;background:none;color:var(--muted);font-size:.86rem;font-weight:500;padding:6px;align-self:center}
.textlink:hover{color:var(--fg)}
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:10px 0}
.done .ok{width:56px;height:56px;border-radius:50%;background:var(--green-soft);color:var(--green-deep);display:grid;place-items:center}
.done .ok svg{width:26px;height:26px}

/* lists */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.item:first-child{border-top:0;padding-top:0}
.item:last-child{padding-bottom:0}
.item .grow{flex:1 1 180px;min-width:0}
.mini{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;overflow:hidden;flex:none}
.mini svg{width:76%;height:76%}
.photo-mini{background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.photo-mini img{width:100%;height:100%;object-fit:contain;padding:3px}
.photo-card{position:relative;z-index:1;height:84%;max-width:72%;aspect-ratio:1/1}
.photo-card img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 18px 18px rgba(15,23,42,.22))}
.shot .credit{position:absolute;left:12px;bottom:10px;font-size:.66rem;color:rgba(15,23,42,.55);font-weight:500}
.p-ph{position:absolute;display:grid;place-items:center}
.p-ph img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2cqw 2.5cqw rgba(0,0,0,.25))}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.fcell{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--solid);min-width:0}
.fimg{width:100%;aspect-ratio:1/1;border-radius:12px;background:repeating-conic-gradient(#F1F5F9 0 25%,#FFFFFF 0 50%) 0 0/16px 16px;display:grid;place-items:center;overflow:hidden}
.fimg img{width:88%;height:88%;object-fit:contain}
.fimg .mini{width:100%;height:100%;border-radius:0}
.fname{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.7rem;color:var(--muted);word-break:break-word}
.spinner.sm{width:12px;height:12px;border-width:2px}
.fcell .chip,.item .chip{height:auto;min-height:24px;white-space:normal;padding:3px 9px;line-height:1.3}
.plus{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:12px;border:1px solid rgba(16,185,129,.25);background:var(--green-soft);color:var(--green-ink);font-weight:700;font-size:.86rem}
.plus:hover{background:#D1FAE5}
.count{font-family:var(--f-head);font-weight:800;font-size:1.3rem;min-width:2.2ch;text-align:right}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.78rem;background:var(--wash);border:1px solid var(--line);padding:1px 7px;border-radius:6px;color:var(--fg-2)}
.empty{color:var(--muted);text-align:center;padding:22px;border:1px dashed var(--line-2);border-radius:var(--r-xl);font-size:.9rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--solid);color:var(--fg);font-weight:600;font-size:.86rem;box-shadow:var(--sh-1);white-space:nowrap}
.btn:hover{background:var(--wash)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#1E3A8A}
.btn.green{background:var(--green-deep);border-color:var(--green-deep);color:#fff}
.btn.green:hover{background:#047857}
.btn.sm{height:32px;padding:0 12px;font-size:.82rem}
label.btn{cursor:pointer}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{padding:13px 16px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle)}
tr:last-child td{border-bottom:0}
td .sub{display:block;font-size:.76rem;color:var(--muted)}
td.low{color:var(--green-ink);font-weight:700}
.prod{display:flex;align-items:center;gap:12px}
.prod .mini{width:38px;height:38px;border-radius:10px}

/* promo rows */
.prow{display:grid;grid-template-columns:52px minmax(0,1.4fr) minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0;padding-top:0}
.prow .mini{width:52px;height:52px;border-radius:14px}
.trio{display:flex;gap:18px}
.trio div{display:flex;flex-direction:column}
.trio b{font-family:var(--f-head);font-weight:700;font-size:1.05rem}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* posts */
.post{container-type:inline-size;aspect-ratio:1/1;max-width:100%;border-radius:9px;overflow:hidden;position:relative;font-family:var(--f-head)}
.post *{line-height:1.05}
.p-top{position:absolute;left:6cqw;top:6cqw;right:6cqw;display:flex;align-items:center;gap:3cqw;font-size:4.6cqw;font-weight:700}
.p-logo{width:11cqw;height:11cqw;border-radius:50%;object-fit:cover;flex:none;display:grid;place-items:center;font-size:4.4cqw;font-weight:800;overflow:hidden}
.p-chip{display:inline-block;padding:1.8cqw 3.6cqw;border-radius:99px;font-size:4cqw;font-weight:800;letter-spacing:.06em}
.p-name{font-size:10cqw;font-weight:800;letter-spacing:-.03em}
.p-size{font-size:5cqw;font-weight:600;opacity:.75;margin-top:1.5cqw}
.p-price{font-size:15cqw;font-weight:800;letter-spacing:-.04em}
.p-foot{position:absolute;left:6cqw;right:6cqw;bottom:5cqw;font-size:4.2cqw;font-family:var(--f-ui);font-weight:500}
.p-foot b{font-weight:700;letter-spacing:.04em}
.p-comp{font-size:4.2cqw;font-family:var(--f-ui);font-weight:500;margin-top:2.5cqw}
.posts3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pp{display:flex;flex-direction:column;gap:10px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{border-radius:14px;padding:10px;min-height:118px;background:var(--solid);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;min-width:0}
.day .d{font-size:.74rem;color:var(--muted);font-weight:600;text-transform:capitalize}
.slot{border-radius:10px;background:var(--blue-soft);padding:7px 8px;font-size:.76rem;line-height:1.3;color:var(--muted)}
.slot b{display:block;color:var(--blue-ink)}

/* invoices */
.relatorio{background:#fff;border-radius:16px;padding:28px;display:grid;gap:14px}.relatorio table{width:100%;border-collapse:collapse}.relatorio th,.relatorio td{text-align:left;padding:8px;border-bottom:1px solid #e5e7eb}.relatorio .num{text-align:right}
@media print{header,nav,.fab,.acts,.tabs,.mtabs{display:none!important}.relatorio{box-shadow:none}}
.chip.c-warn{background:#fff4e5;color:#9a5b00}.edit.warn{border-color:#f0a020;background:#fffaf0}
.real-local{display:grid;gap:4px;margin-top:14px;padding:14px;border-radius:12px;background:rgba(37,99,235,.06)}.real-local .real-login{justify-items:start;border:0;margin-top:6px;padding-top:0;max-width:none}.real-local .opts{justify-content:flex-start}
.real-login{display:grid;gap:8px;justify-items:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--line,#e5e7eb);width:100%;max-width:480px}.real-login .opts{flex-wrap:wrap;justify-content:center}.real-login input{min-width:220px}.linkbtn{background:none;border:0;padding:0;color:inherit;text-decoration:underline;cursor:pointer;font:inherit}
.drop{border:1.5px dashed var(--line-2);border-radius:var(--r-2xl);padding:34px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;background:var(--glass)}
.drop.over{border-color:var(--blue-2);background:var(--blue-soft)}
.drop .big-ic{width:56px;height:56px;border-radius:16px;background:var(--blue-soft);color:var(--blue-2);display:grid;place-items:center}
.drop .big-ic svg{width:26px;height:26px}
.opts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.fileinput{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.reading{display:flex;align-items:center;gap:14px}
.spinner{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--blue-soft);border-top-color:var(--blue-2);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.doc{width:56px;height:72px;border-radius:10px;border:1px solid var(--line);background:var(--solid);display:grid;place-items:center;font-size:.7rem;font-weight:700;color:var(--blue-ink);object-fit:cover;flex:none;box-shadow:var(--sh-1)}
.edit{width:92px;height:34px;padding:0 10px;border:1px solid var(--line-2);border-radius:10px;background:var(--solid);text-align:right}
select.edit{width:auto;text-align:left}

/* config */
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label{font-size:.82rem;font-weight:600;color:var(--fg-2)}
.field input[type=text],.field input[type=number],.field select{height:42px;padding:0 12px;border:1px solid var(--line-2);border-radius:12px;background:var(--solid);width:100%}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:12px;padding:5px 12px 5px 5px;background:var(--solid)}
.swatch input{width:32px;height:32px;border:0;padding:0;background:none}
.marg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.marg input{text-align:right}

/* FAB + sheet */
.fab{position:fixed;z-index:25;right:calc(max(16px,env(safe-area-inset-right,0px)) + 8px);bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;height:56px;padding:0 20px 0 16px;border:0;border-radius:18px;background:linear-gradient(180deg,#2563EB,var(--blue));color:#fff;font-weight:700;font-size:.92rem;box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 18px 36px -14px rgba(30,64,175,.75)}
.fab svg{width:22px;height:22px}
.fab{transition:transform .25s ease}
.fab.hide{transform:translateY(170%)}
.tw2{position:relative;min-width:0}
.tw2 .thumb{width:100%}
.zoom{position:absolute;right:0;bottom:-3px;width:28px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--solid);color:var(--fg-2);display:grid;place-items:center;box-shadow:var(--sh-1)}
.zoom svg{width:15px;height:15px}
.zoom:hover{background:var(--wash)}
.zoombox{position:fixed;z-index:46;left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;background:var(--glass-strong);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:24px;box-shadow:var(--sh-3);padding:14px;display:flex;flex-direction:column;gap:12px}
.zb-h{display:flex;align-items:center;gap:10px;padding:0 4px}
.zb-h .icon-btn{margin-left:auto}
.zb-post .post{border-radius:14px}
.zb-a{display:flex;gap:10px;align-items:center}
.zb-a .btn{flex:1;height:46px;font-size:.95rem}
.zb-a .icon-btn{width:46px;height:46px;border-radius:14px}
.fab:hover{filter:brightness(1.06)}
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:45}
.sheet{position:fixed;z-index:46;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 2 * max(16px,env(safe-area-inset-left,0px))));background:var(--glass-strong);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:24px;box-shadow:var(--sh-3);padding:18px;display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--solid);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
.opt:hover{border-color:var(--line-2);box-shadow:var(--sh-1)}
.opt .oi{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.opt .oi svg{width:20px;height:20px}
.opt b{display:block;font-size:.95rem}
.opt span{font-size:.8rem;color:var(--muted)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:#0F172A;color:#F8FAFC;padding:11px 18px;border-radius:999px;font-weight:500;font-size:.88rem;box-shadow:var(--sh-3);z-index:50;max-width:calc(100% - 32px);text-align:center}
.foot-note{text-align:center;color:var(--subtle);font-size:.78rem}
.foot-note button{border:0;background:none;color:var(--blue-ink);font-weight:600;font-size:.78rem;padding:0 4px}

.post svg.art,.reel svg.art{height:76%;width:auto;max-width:80%}
.ctrack{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;scrollbar-width:thin}
.cslide{flex:0 0 250px;scroll-snap-align:start;max-width:80%}
.reel-wrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;align-items:start}
.phone{width:240px;max-width:100%;aspect-ratio:9/16;border-radius:30px;background:#0F172A;padding:8px;box-shadow:var(--sh-3)}
.reel{container-type:inline-size;position:relative;width:100%;height:100%;border-radius:23px;overflow:hidden;background:#0F172A}
.scene{position:absolute;inset:0;opacity:0;animation:scene 9s infinite}
.scene:nth-child(2){animation-delay:3s}.scene:nth-child(3){animation-delay:6s}
.scene .rz{animation:rz 9s infinite}
.scene .rp{animation:rp 9s 3s infinite}
@keyframes scene{0%{opacity:0}3%{opacity:1}31%{opacity:1}34%{opacity:0}100%{opacity:0}}
@keyframes rz{0%{transform:scale(.7) rotate(-6deg)}12%{transform:scale(1.02) rotate(0)}33%{transform:scale(1)}100%{transform:scale(1)}}
@keyframes rp{0%,8%{transform:scale(.6);opacity:0}14%{transform:scale(1.06);opacity:1}20%,100%{transform:scale(1);opacity:1}}
.rbar{position:absolute;left:6cqw;right:6cqw;top:4cqw;height:1.2cqw;border-radius:9px;background:rgba(255,255,255,.35);overflow:hidden;z-index:2}
.rbar i{display:block;height:100%;background:#fff;animation:rbar 9s linear infinite}
@keyframes rbar{from{width:0}to{width:100%}}
.story{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.story li{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--solid)}
.story b{font-size:.86rem}.story span{font-size:.84rem;color:var(--fg-2)}.story em{font-size:.8rem;color:var(--muted)}
.seg{display:inline-flex;background:var(--wash);border:1px solid var(--line);border-radius:999px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-weight:500;font-size:.8rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--solid);color:var(--fg);box-shadow:var(--sh-1)}

  .tabbar button svg{width:22px;height:22px}
  .tabbar button[aria-current="page"]{color:var(--blue)}
  .tabbar .dot{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:99px;background:var(--orange);color:#fff;font-size:.62rem;display:grid;place-items:center;padding:0 4px}
  .fab{bottom:calc(var(--tabbar) + 14px + env(safe-area-inset-bottom,0px));height:54px;width:54px;padding:0;justify-content:center;border-radius:18px}
  .fab span{display:none}
  .toast{bottom:calc(var(--tabbar) + 82px + env(safe-area-inset-bottom,0px))}
  main{padding-block:18px calc(var(--tabbar) + 100px)}
  .metrics{grid-template-columns:minmax(0,1fr);gap:10px}

  .grid2{grid-template-columns:minmax(0,1fr)}
  .posts3{grid-template-columns:minmax(0,1fr)}
  .pp{max-width:340px;width:100%;margin:0 auto}
  .cal{grid-template-columns:minmax(0,1fr)}
  .day{min-height:0}
  .marg{grid-template-columns:repeat(2,minmax(0,1fr))}
  .me-btn .who{display:none}
  .me-btn{padding:3px}
  h1{font-size:1.35rem}
  .pv.new b{font-size:1.8rem}
  .prices{grid-template-columns:auto auto;gap:12px 18px}
  .pv.mg{grid-column:1/-1;justify-self:start;text-align:left}
  .bar{grid-template-columns:84px minmax(0,1fr) 56px;gap:10px}
}

  const m=S.margins[p.cat]/100,min=p.cost/(1-m),low=lowComp(p).price;
  if(low==null){let pr=r2(Math.ceil((min+0.0001)*10)/10-0.01);if(pr<min)pr=r2(pr+0.10);return {price:pr,min,low:null,margin:(pr-p.cost)/pr,minMargin:m,beats:false,semPreco:true}}   // ainda sem preço da concorrência
  let price=r2(Math.round(low*0.97*10)/10-0.01);
  if(price>=low)price=r2(price-0.10);
  if(price<min)price=r2(Math.ceil((min+0.0001)*10)/10-0.01);
  if(price<min)price=r2(price+0.10);
  return {price,min,low,margin:(price-p.cost)/price,minMargin:m,beats:price<low};
}
function promo(id){return S.promos[id]||{status:'pending',choice:null,sched:null,clients:0}}
function setPromo(id,patch){S.promos[id]=Object.assign({},promo(id),patch)}
function prod(id){return S.products.find(p=>p.id===id)}
function initials(n){return n.split(/\s+/).filter(w=>w.length>2).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'AM'}
function code(p){return p.name.split(' ')[0].normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().slice(0,8)+'-'+initials(S.store.name)}
function networks(){const s=S.store,n=[];if(s.fb)n.push('Facebook');if(s.ig)n.push('Instagram');if(s.gmb)n.push('Google');return n}
function ink(hex){const h=hex.replace('#','');const [r,g,b]=[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255).map(c=>c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4));return (.2126*r+.7152*g+.0722*b)>.45?'#0F172A':'#FFFFFF'}
function timeAgo(t){const m=Math.round((Date.now()-new Date(t))/60000);if(m<1)return 'agora';if(m<60)return 'há '+m+' min';const h=Math.round(m/60);if(h<24)return 'há '+h+' h';return 'há '+Math.round(h/24)+' d'}
const dfmt=new Intl.DateTimeFormat('pt-PT',{weekday:'short',day:'numeric',month:'short'});
const dlong=new Intl.DateTimeFormat('pt-PT',{weekday:'long',day:'numeric',month:'long'});
function whenTxt(s){return dfmt.format(new Date(s.at))+' · '+s.time}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}
function log(text){S.log.unshift({t:new Date().toISOString(),store:S.store.name,text})}
function nextSlot(){
  const used=new Set(Object.values(S.promos).filter(p=>p.sched).map(p=>p.sched.day));if(S.carousel&&S.carousel.sched)used.add(S.carousel.sched.day);if(S.reel&&S.reel.sched)used.add(S.reel.sched.day);
  for(let i=1;i<60;i++){const d=new Date();d.setDate(d.getDate()+i);if(used.has(dayKey(d)))continue;const time=i%2?'19:00':'12:30';const [h,m]=time.split(':');d.setHours(+h,+m,0,0);return {at:d.toISOString(),day:dayKey(d),time}}
}
function stats(){
  const all=S.products.map(p=>({p,s:suggest(p),pr:promo(p.id)}));
  const queue=all.filter(x=>x.pr.status==='pending'&&!x.s.semPreco).sort((a,b)=>(b.s.beats-a.s.beats)||((a.p.cat==='Frescos'?0:1)-(b.p.cat==='Frescos'?0:1)));
  const appr=all.filter(x=>x.pr.status==='approved');
  const avg=appr.length?appr.reduce((a,x)=>a+x.s.margin,0)/appr.length:0;
  const clients=S.clientsBase+Object.values(S.promos).reduce((a,p)=>a+(p.clients||0),0);
  return {all,queue,pending:queue.length,appr,avg,clients,toDesign:appr.filter(x=>x.pr.choice==null).length,scheduled:appr.filter(x=>x.pr.sched)};
}

function resultados(){

  const map={server_not_connected:'Conector não ligado (Google Drive, Composio ou Apify)',needs_reauth:'Volte a ligar o conector nas definições do claude.ai',not_in_manifest:'Acesso ao conector não autorizado nesta página',approval_required:'Precisa da sua autorização para continuar',selection_required:'Escolha qual conector usar',server_unavailable:'Serviço indisponível; tente daqui a pouco',tool_error:'O serviço devolveu um erro'};
  return map[c]||String((e&&e.message)||'Não foi possível tratar a foto').slice(0,90);

function rawOf(r){
  if(!r)return '';
  if(typeof r.payload==='string')return r.payload;
  try{return JSON.stringify(r.payload!==undefined?r.payload:r.content)}catch(e){return ''}
}
function norm(t){return String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}

async function findImageUrl(p){
  if(p.img)return p.img;
  const r=await MCP.callTool('apify','call-actor',{actor:'trovevault/portugal-supermarket-prices',input:{supermarkets:['continente'],keyword:p.search.kw,brand:p.search.brand,maxProductsPerSupermarket:12},waitSecs:45});
  let ds=null;
  try{ds=r.payload.storages.datasets.default.id}catch(e){}
  if(!ds){const m=rawOf(r).replace(/\\"/g,'"').match(/"datasets"\s*:\s*\{\s*"default"\s*:\s*\{\s*"id"\s*:\s*"([A-Za-z0-9]+)"/);ds=m&&m[1]}
  if(!ds)throw {message:'A pesquisa do produto não devolveu resultados'};
  const it=await MCP.callTool('apify','get-dataset-items',{datasetId:ds,fields:'productName,packageSize,imageUrl',limit:12});
  let items=(it.payload&&it.payload.items)||[];
  if(!items.length){try{items=JSON.parse(rawOf(it)).items||[]}catch(e){}}
  const toks=norm(p.search.match).split(/\s+/);
  let best=null,bs=-1;
  for(const x of items){
    if(!x||!x.imageUrl)continue;
    const h=norm(x.productName+' '+(x.packageSize||''));
    const sc=toks.filter(t=>h.includes(t)).length;
    if(sc>bs){bs=sc;best=x}
  }
  if(!best)throw {message:'Não encontrei foto deste produto'};
  return String(best.imageUrl).split('?')[0];
}

async function fetchB64(url){
  const base=url.split('?')[0];
  if(!/^https:\/\/www\.continente\.pt\/dw\/image\/[A-Za-z0-9_\-\/.]+$/.test(base))throw {message:'Link de imagem inesperado'};
  const u=base+'?sw=700&sh=700';
  const code=[
    "import requests,base64,io",
    "from PIL import Image",
    "r=requests.get("+JSON.stringify(u)+",headers={'User-Agent':'Mozilla/5.0'},timeout=30)",
    "im=Image.open(io.BytesIO(r.content))",
    "if im.mode in ('RGBA','LA','P'):",
    "    im=im.convert('RGBA'); bg=Image.new('RGB',im.size,(255,255,255)); bg.paste(im,mask=im.split()[3]); im=bg",
    "else:",
    "    im=im.convert('RGB')",
    "im.thumbnail((620,620))",
    "q=90",
    "while True:",
    "    b=io.BytesIO(); im.save(b,'JPEG',quality=q); s=base64.b64encode(b.getvalue()).decode()",
    "    if len(s)<38000 or q<=50: break",
    "    q-=6",
    "print('B64:'+s+':END')"
  ].join('\n');
  const r=await MCP.callTool('Composio','COMPOSIO_REMOTE_WORKBENCH',{code_to_execute:code,thought:'Descarregar a foto de um produto para a admarket'});
  const m=rawOf(r).match(/B64:([A-Za-z0-9+\/=]+):END/);
  if(!m)throw {message:'A foto não foi descarregada'};
  return m[1];
}

function loadImg(src){return new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=src})}
function blobToB64(b){return new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=ko;r.readAsDataURL(b)})}
function b64ToBlob(b64,type){const bin=atob(b64),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type})}

/* tira o fundo branco do packshot e centra o produto num quadrado 600x600 com margem igual */
async function cutout(b64){
  const img=await loadImg('data:image/jpeg;base64,'+b64),W=img.naturalWidth,H=img.naturalHeight;
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');x.drawImage(img,0,0);
  const id=x.getImageData(0,0,W,H),d=id.data,bg=new Uint8Array(W*H),st=[];
  const isBg=i=>{const r=d[i*4],g=d[i*4+1],b=d[i*4+2],mn=Math.min(r,g,b),mx=Math.max(r,g,b);return mn>=247&&mx-mn<9};
  for(let X=0;X<W;X++){st.push(X,(H-1)*W+X)}
  for(let Y=0;Y<H;Y++){st.push(Y*W,Y*W+W-1)}
  while(st.length){
    const i=st.pop();
    if(bg[i]||!isBg(i))continue;
    bg[i]=1;
    const X=i%W,Y=(i/W)|0;
    if(X>0)st.push(i-1);if(X<W-1)st.push(i+1);if(Y>0)st.push(i-W);if(Y<H-1)st.push(i+W);
  }
  /* buracos fechados de branco puro (ex.: pega do garrafão) também são fundo */
  const pure=i=>{const r=d[i*4],g=d[i*4+1],b=d[i*4+2];return Math.min(r,g,b)>=251&&Math.max(r,g,b)-Math.min(r,g,b)<5};
  const seen=new Uint8Array(W*H);
  for(let s0=0;s0<W*H;s0++){
    if(bg[s0]||seen[s0]||!pure(s0))continue;
    const reg=[],q=[s0];seen[s0]=1;let edge=0,neutral=0;
    while(q.length){const i=q.pop();reg.push(i);const X=i%W,Y=(i/W)|0;
      for(const n of [X>0?i-1:-1,X<W-1?i+1:-1,Y>0?i-W:-1,Y<H-1?i+W:-1]){if(n<0||seen[n]||bg[n])continue;
        if(pure(n)){seen[n]=1;q.push(n)}else{edge++;const r=d[n*4],g=d[n*4+1],b=d[n*4+2],mn=Math.min(r,g,b),mx=Math.max(r,g,b);if(mn>=170&&mx-mn<7)neutral++}}}
    if(reg.length>W*H*0.004&&edge&&neutral/edge>0.9)for(const i of reg)bg[i]=1;
  }
  let x0=W,y0=H,x1=-1,y1=-1;
  for(let Y=0;Y<H;Y++)for(let X=0;X<W;X++){
    const i=Y*W+X;
    if(bg[i]){d[i*4+3]=0;continue}
    const nb=(X>0&&bg[i-1])||(X<W-1&&bg[i+1])||(Y>0&&bg[i-W])||(Y<H-1&&bg[i+W]);
    if(nb){const mn=Math.min(d[i*4],d[i*4+1],d[i*4+2]);if(mn>236)d[i*4+3]=Math.max(90,255-(mn-236)*14)}
    if(X<x0)x0=X;if(X>x1)x1=X;if(Y<y0)y0=Y;if(Y>y1)y1=Y;
  }
  if(x1<0)throw {message:'Não consegui recortar esta foto'};
  x.putImageData(id,0,0);
  const S2=600,pad=0.08,cw=x1-x0+1,ch=y1-y0+1,k=Math.min(S2*(1-2*pad)/cw,S2*(1-2*pad)/ch);
  const o=document.createElement('canvas');o.width=S2;o.height=S2;
  const ox=o.getContext('2d');ox.imageSmoothingQuality='high';
  const w=cw*k,h=ch*k;
  ox.drawImage(c,x0,y0,cw,ch,(S2-w)/2,(S2-h)/2,w,h);
  const blob=await new Promise(ok=>o.toBlob(ok,'image/png'));
  return {blob,b64:await blobToB64(blob)};
}

async function driveFind(name){
  const q="parentId = '"+DRIVE_FOLDER+"' and title = '"+name.replace(/\\/g,'\\\\').replace(/'/g,"\\'")+"'";
  const r=await MCP.callTool('Google Drive','search_files',{query:q,excludeContentSnippets:true,pageSize:5},{cache:false});
  const files=(r.payload&&r.payload.files)||[];
  return files.find(f=>f.title===name)||null;
}
async function driveDownload(fid){
  const r=await MCP.callTool('Google Drive','download_file_content',{fileId:fid});
  const p=r.payload;
  let s=typeof p==='string'?p:null;
  if(!s&&p&&typeof p==='object'){
    const walk=o=>{for(const k in o){const v=o[k];if(typeof v==='string'&&v.length>800&&/^[A-Za-z0-9+\/=\s]+$/.test(v.slice(0,200)))return v;if(v&&typeof v==='object'){const f=walk(v);if(f)return f}}return null};
    s=walk(p);
  }
  if(!s)throw {message:'Não consegui ler a foto do Drive'};
  return b64ToBlob(s.replace(/\s/g,''),'image/png');
}
async function driveUpload(name,blob,b64){
  const content=FILEARGS?{$file:{data:blob,name:'foto.png',type:'image/png'}}:b64;
  const r=await MCP.callTool('Google Drive','create_file',{title:name,parentId:DRIVE_FOLDER,base64Content:content,contentMimeType:'image/png',disableConversionToGoogleType:true});
  return (r.payload&&r.payload.id)||null;
}

/* regra: primeiro a biblioteca, depois o Drive, só no fim a internet */
async function ensurePhoto(p){
  if(!p)return;
  const name=fileName(p);
  if(LIB[p.id]&&LIB[p.id].assetId){setP(p.id,'lib','Foto já na biblioteca');return}
  if(!canPhotos()){setP(p.id,'err','Só o dono da loja, com os conectores ligados, pode preparar fotos');return}
  try{
    setP(p.id,'run','A verificar se já existe no Drive…');
    let blob=null,driveId=null,src='drive';
    const ex=await driveFind(name);
    if(ex){
      driveId=ex.id;setP(p.id,'run','Já existe no Drive · a reaproveitar…');
      blob=await driveDownload(ex.id);
    }else{
      setP(p.id,'run',p.img?'A ir buscar a foto à internet…':'A procurar o produto na internet…');
      const url=await findImageUrl(p);
      setP(p.id,'run','A descarregar a foto…');
      const b64=await fetchB64(url);
      setP(p.id,'run','A remover o fundo e a alinhar…');
      const out=await cutout(b64);blob=out.blob;
      setP(p.id,'run','A guardar no Drive…');
      driveId=await driveUpload(name,out.blob,out.b64);src='internet';
    }
    const up=await ASSETS.upload(blob,{type:'image/png'});
    await DB.doc('fotos/'+p.id).set({ficheiro:name,assetId:up.id,driveId:driveId||null,origem:src,em:new Date().toISOString()});
    LIB[p.id]={ficheiro:name,assetId:up.id};rebuildPhotos();
    setP(p.id,'ok',src==='internet'?'Fundo removido · guardada no Drive':'Reaproveitada do Drive');
  }catch(e){setP(p.id,'err',errTxt(e))}
}

function readInvoiceFile(file){
  if(!file)return;S.sheet=false;

  if(REAL.on){if(isPdf)lerFaturaReal(file,{name:file.name,kind:'PDF',preview:null});else shrink(file,240).then(url=>lerFaturaReal(file,{name:file.name,kind:'Foto',preview:url})).catch(()=>lerFaturaReal(file,{name:file.name,kind:'Foto',preview:null}));return}
  if(isPdf||!file.type.startsWith('image/')){startInvoice({name:file.name,kind:'PDF',preview:null});return}
  shrink(file,240).then(url=>startInvoice({name:file.name,kind:'Foto',preview:url})).catch(()=>startInvoice({name:file.name,kind:'Foto',preview:null}));
}
function shrink(file,max){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);shrink.last=img;res(c.toDataURL('image/png'))};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
function extractColors(img){
  try{const n=48,c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d');x.drawImage(img,0,0,n,n);const d=x.getImageData(0,0,n,n).data,b={};
    for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],bl=d[i+2];if(d[i+3]<128)continue;const mx=Math.max(r,g,bl),mn=Math.min(r,g,bl);if(mx-mn<30||mx<35||mn>230)continue;const k=(r>>5)+','+(g>>5)+','+(bl>>5);(b[k]=b[k]||{n:0,r:0,g:0,b:0});b[k].n++;b[k].r+=r;b[k].g+=g;b[k].b+=bl}
    const list=Object.values(b).sort((a,z)=>z.n-a.n).map(o=>[o.r/o.n,o.g/o.n,o.b/o.n].map(Math.round));if(!list.length)return null;
    const hex=a=>'#'+a.map(v=>v.toString(16).padStart(2,'0')).join(''),first=list[0],second=list.find(a=>Math.hypot(a[0]-first[0],a[1]-first[1],a[2]-first[2])>90);
    return [hex(first),second?hex(second):null];
  }catch(e){return null}
}

/* --- ler PDF no browser: texto por linhas + QR, sem IA --- */
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
async function pdfLer(file){
  await loadJS(PDFJS+'pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';
  const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let texto='',qr=null;
  for(let n=1;n<=Math.min(doc.numPages,5);n++){
    const pg=await doc.getPage(n),tc=await pg.getTextContent(),rows={};
    for(const it of tc.items){if(!it.str.trim())continue;const y=Math.round(it.transform[5]/3);(rows[y]=rows[y]||[]).push(it)}
    texto+=Object.keys(rows).sort((a,b)=>b-a).map(y=>rows[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str.trim()).join(' ')).join('\n')+'\n';
    if(!qr){const v=pg.getViewport({scale:3}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise;qr=await qrDe(c)}
  }
  return {texto,qr};
}
async function qrDe(canvas){
  await loadJS('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js');
  const x=canvas.getContext('2d'),d=x.getImageData(0,0,canvas.width,canvas.height);
  const r=jsQR(d.data,d.width,d.height,{inversionAttempts:'dontInvert'});
  return r&&r.data.includes('A:')?r.data:null;
}
/* limpa a foto: cinzento + limiar adaptativo (aguenta sombras e luz desigual) */
function prepOCR(src){const W=src.width,H=src.height,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.filter='grayscale(1) blur(1px)';x.drawImage(src,0,0);const im=x.getImageData(0,0,W,H),d=im.data,g=new Float64Array((W+1)*(H+1));

function juntarPalavras(words){

async function ocr(canvas,onp){

async function lerFaturaReal(file,info){

  const step=m=>{if(S.pending){S.pending.msg=m;render()}};

      const qr=P.lerQR(body.qr),r=P.lerLinhas(body.texto||'',null);

      S.pending=Object.assign({},S.pending,{stage:'real-review',res:{local:true,metodo:'regras',tokens:0,cabecalho:qr||{},validada_qr:P.bate(r.linhas,qr),
        linhas:r.linhas.map(l=>({id:null,ean:l.ean,descricao:l.descricao,quantidade:l.quantidade,custo_unit:l.preco_unit*(1-l.desconto_pct/100),produto_id:null}))}});

}

function medida(t){
  t=norm(t).replace(/(\d),(\d)/g,'$1.$2');let m=t.match(/(\d+(?:\.\d+)?)\s*x\s*(\d+(?:\.\d+)?)\s*(kg|gr|g|ml|cl|lt|l)\b/),n,u;

}
const QUALIF=['lactose','proteina','cacau','chocolate','bio','light','zero','descafeinado','soluvel','capsulas','grao','integral','acucar','spray','pack'],QUALIF_VAR=['magro','gordo'];
function folhetoCombina(p,f){
  const n=norm(f.nome),b=norm(p.brand||'');if(b.length<3||!n.includes(b))return null;     // a marca tem de aparecer
  const own=norm(p.prod+' '+p.name+' '+(p.size||''));
  const pal=norm(p.prod||p.name).split(/[^a-z0-9]+/).filter(w=>w.length>3&&!b.includes(w));
  if(pal.length&&!pal.some(w=>n.includes(w.slice(0,5))))return null;                        // e pelo menos uma palavra do produto
  if(QUALIF.some(q=>n.includes(q)&&!own.includes(q)))return null;                           // "sem lactose", "em grão"... é outro produto
  if(!/\/\s/.test(f.nome)&&QUALIF_VAR.some(q=>n.includes(q)&&!own.includes(q)))return null; // "magro" (só aceita se for lista de variantes "MAGRO/ MEIO GORDO")
  const sp=medida(p.qty||p.size||''),sf=medida(f.tamanho||f.nome);
  if(sp&&sf&&(sp.d!==sf.d||Math.abs(sp.v-sf.v)/sp.v>0.05))return null;                     // outro tamanho
  return {certo:!!(sp&&sf)};
}
function folhetosDe(p){

const descNorm=d=>String(d||'').toLowerCase().replace(/\s+/g,' ').trim().slice(0,200);
async function sugerirProdutos(pe){
  if(!REAL.sb||!pe?.res?.linhas?.length||pe.res.local)return;
  pe.sug=null;pe.esc={};
  try{
    const nif=pe.res.cabecalho?.nifFornecedor||'';
    const {data,error}=await REAL.sb.functions.invoke('sugerir-produtos',{body:{linhas:pe.res.linhas.map(l=>({descricao:l.descricao,nif}))}});
    if(error)throw error;
    pe.sug=data.linhas||[];
  }catch(e){pe.sug=pe.res.linhas.map(()=>({candidatos:[]}))}
  if(S.pending===pe)render();
  // fotos sem fundo: as que ainda não existem são feitas agora (uma vez para todas as lojas)
  const objs=(pe.sug||[]).flatMap(r=>[r.produto,...(r.candidatos||[])]).filter(Boolean);
  await tirarFundos(objs,'imagem');
  if(S.pending===pe)render();
}
const eSemFundo=u=>!u||/\/storage\/v1\/object\/public\/fotos-produtos\//.test(u);
async function tirarFundos(objs,campo){
  if(!REAL.sb)return;
  const urls=[...new Set(objs.map(o=>o[campo]).filter(u=>u&&!eSemFundo(u)&&/^https?:/.test(u)))];
  const lotes=[];for(let i=0;i<urls.length;i+=6)lotes.push(urls.slice(i,i+6));
  const mapa={};
  await Promise.all(lotes.map(async l=>{try{const {data}=await REAL.sb.functions.invoke('foto-sem-fundo',{body:{urls:l}});Object.assign(mapa,data?.fotos||{})}catch(e){}}));
  let mudou=false;for(const o of objs){const n=mapa[o[campo]];if(n){o.original=o[campo];o[campo]=n;mudou=true}}
  return mudou;
}
// produtos já confirmados com foto do site ainda com fundo: trocar pela versão sem fundo
async function fundosProdutos(){
  const ps=S.products.filter(p=>p.img&&!eSemFundo(p.img));if(!ps.length)return;
  if(await tirarFundos(ps,'img')){for(const p of ps)if(eSemFundo(p.img))PHOTOS[p.id]=p.img;render()}
  if(S.porConfirmar?.length)await tirarFundos(S.porConfirmar.flatMap(x=>x.candidatos||[]),'imagem');
}
function escolhido(pe,i){const sg=pe.sug?.[i];if(!sg)return null;if(sg.conhecido&&pe.esc?.[i]!==-1)return sg.produto;const k=pe.esc?.[i];return k>=0?sg.candidatos?.[k]||null:null}
function fotoCand(c,w){return c?.imagem?`<img src="${esc(c.imagem)}" alt="" loading="lazy" referrerpolicy="no-referrer" style="width:${w}px;height:${w}px;object-fit:contain;background:${eSemFundo(c.imagem)?'transparent':'#fff'};border-radius:10px;flex:none" onerror="this.style.visibility='hidden'">`:`<span style="width:${w}px;height:${w}px;border-radius:10px;background:var(--line,#E5E7EB);flex:none"></span>`}
function nomeCand(c){const n=String(c.produto||''),m=String(c.marca||'');return norm(n).includes(norm(m))||!m?n:n+' '+m}
function candBtns(cs,sel,act,attrs){
  return `<div style="display:flex;gap:8px;flex-wrap:wrap">${cs.map((c,k)=>`<button class="cand" data-act="${act}" ${attrs} data-k="${k}" aria-pressed="${sel===k}" style="display:flex;gap:8px;align-items:center;text-align:left;padding:6px 10px 6px 6px;border-radius:12px;border:2px solid ${sel===k?'var(--green,#16A34A)':'var(--line,#E5E7EB)'};background:${sel===k?'var(--green-soft,#ECFDF5)':'#fff'};max-width:230px;cursor:pointer">${fotoCand(c,52)}<span style="min-width:0"><b class="xs" style="display:block;line-height:1.25">${esc(nomeCand(c))}</b><span class="xs muted">${esc(c.tamanho?tamanhoBonito(c.tamanho):'')}</span></span></button>`).join('')}
    <button class="btn sm" data-act="${act}" ${attrs} data-k="-1" aria-pressed="${sel===-1}" style="${sel===-1?'border-color:var(--orange,#F97316)':''}">Nenhum destes</button></div>`;
}
function escolhaHTML(pe,i){
  const sg=pe.sug?.[i];
  if(pe.sug==null)return `<span class="xs muted"><span class="spinner"></span> A procurar o produto…</span>`;
  if(!sg)return '<span class="chip c-grey">Fica por confirmar</span>';
  if(sg.conhecido&&pe.esc?.[i]!==-1)return `<div style="display:flex;gap:8px;align-items:center">${fotoCand(sg.produto,52)}<span><b class="xs" style="display:block">${esc(nomeCand(sg.produto))}</b><span class="chip c-green">${IC.check}Reconhecido</span> <button class="textlink xs" data-act="esc-prod" data-i="${i}" data-k="-1">não é</button></span></div>`;
  const cs=sg.candidatos||[];
  if(!cs.length)return '<span class="chip c-grey">Sem sugestões · fica por confirmar</span>';
  return candBtns(cs,pe.esc?.[i],'esc-prod',`data-i="${i}"`);
}
ACT['esc-prod']=(id,el)=>{const pe=S.pending;if(!pe)return;const b=el||document.activeElement;const i=+b.dataset.i,k=+b.dataset.k;pe.esc=pe.esc||{};pe.esc[i]=pe.esc[i]===k&&k>=0?undefined:k;render()};
const CAT_PAL={Frescos:['leite','iogurte','queijo','manteiga','fiambre','fruta','banana','maca','ovos','natas','presunto','carne','peixe','legume'],Bebidas:['agua','sumo','cerveja','vinho','refrigerante','cola','bebida','nectar'],Higiene:['detergente','lixivia','papel','champo','gel','sabonete','amaciador','pasta','dentes','limpa','fralda']};
function categoria(t){t=norm(t);for(const c in CAT_PAL)if(CAT_PAL[c].some(w=>t.includes(w)))return c;return 'Mercearia'}
function tamanhoBonito(t){const m=medida(t||'');if(!m)return String(t||'').replace(/^emb\.?\s*/i,'');if(m.d==='g')return m.v>=1000?String(m.v/1000).replace('.',',')+' kg':Math.round(m.v)+' g';if(m.d==='ml')return m.v>=1000?String(m.v/1000).replace('.',',')+' L':m.v%10===0?m.v/10+' cl':Math.round(m.v)+' ml';return m.v+' '+m.d}
const LOJA_COMP={'continente':'continente','pingo doce':'pingo','auchan':'auchan'};
function adicionarConfirmado(c,{custo,qtd,inv}){
  const marca=c.marca||'',nome=nomeCand(c),qty=tamanhoBonito(c.tamanho);
  const prodSem=String(c.produto||'').split(/\s+/).filter(w=>!norm(marca).split(' ').includes(norm(w))).join(' ')||c.produto;
  const id='p-'+norm(marca+' '+prodSem+' '+qty).replace(/[^a-z0-9]+/g,'-').slice(0,60);
  const comp={};const lk=LOJA_COMP[norm(c.loja)];if(lk&&c.preco>0)comp[lk]=+c.preco;   // preço visto ao procurar: serve já de referência
  const ex=prod(id),item={id,name:titulo(nome),size:qty,prod:prodSem,qty,brand:marca,cat:categoria(nome),cost:r2(custo),qty_:qtd||0,inv,img:c.imagem||null,real:true,confirmado:true,comp:Object.assign({},ex?.comp||{},comp)};
  if(ex){Object.assign(ex,item);return false}
  S.products.push(item);delete S.promos[id];return true;
}
// produtos que ficaram por confirmar: aparecem nas Promoções para confirmar mais tarde
function porConfirmarHTML(){
  const pc=S.porConfirmar||[];if(!pc.length)return '';
  return `<section class="card pad"><div class="card-h"><div><h2>Por confirmar</h2><span class="xs muted">Sem confirmação não há sugestões de promoção para estes produtos</span></div><span class="chip c-warn">${pc.length}</span></div>
    <div class="list">${pc.map((x,j)=>`<div class="item" style="align-items:flex-start;flex-direction:column;gap:8px"><div><b>${esc(x.desc)}</b> <span class="xs muted">· custo ${eur(x.custo)} · ${esc(x.inv)}</span></div>${x.candidatos?.length?candBtns(x.candidatos,null,'pc-prod',`data-j="${j}"`):'<span class="xs muted">Sem sugestões dos sites para esta descrição.</span>'}</div>`).join('')}</div></section>`;
}
ACT['pc-prod']=(id,el)=>{const b=el||document.activeElement,j=+b.dataset.j,k=+b.dataset.k,x=(S.porConfirmar||[])[j];if(!x)return;
  if(k>=0){const c=x.candidatos[k];REAL.sb?.rpc('confirmar_produto',{p_desc:descNorm(x.desc),p_nif:x.nif||'',p_marca:c.marca||'',p_produto:c.produto,p_tamanho:c.tamanho||'',p_imagem:c.imagem||'',p_ok:true}).then(()=>{});adicionarConfirmado(c,{custo:x.custo,qtd:x.qtd,inv:x.inv});toast('Confirmado: '+titulo(nomeCand(c)))}
  else toast('Fica fora das promoções: '+x.desc);
  S.porConfirmar.splice(j,1);render()};
sbInit();
if(S.pending&&S.pending.real&&S.pending.stage==='reading')S.pending=null;
if(S.pending&&S.pending.stage==='reading')S.pending.stage='review';
render();
})();
</script>
